name: Build

# - push / pull request : tests + paquets Linux (flatpak) et Windows, disponibles dans les artefacts du run
# - tag v* (ex. v1.2.0) : en plus, publication d'une release GitHub avec les paquets
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLATPAK_BRANCH: '26.08' # doit correspondre à build.flatpak.runtimeVersion / baseVersion dans package.json

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Le tag correspond à la version de package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME différent de la version $v de package.json"
            exit 1
          fi

  linux:
    name: Linux (flatpak)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Outils flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Cache des runtimes flatpak
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-${{ env.FLATPAK_BRANCH }}-${{ runner.os }}-v1
      - name: Runtimes (freedesktop + base Electron)
        run: |
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//${FLATPAK_BRANCH} \
            org.freedesktop.Sdk//${FLATPAK_BRANCH} \
            org.electronjs.Electron2.BaseApp//${FLATPAK_BRANCH}
          flatpak update --user -y --noninteractive
      - run: npm ci
      - name: Paquet flatpak
        run: npm run dist:linux
        env:
          DEBUG: '@malept/flatpak-bundler'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Installeur + version portable
        run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
